# Dependabot: weekly update checks for NuGet packages and GitHub Actions.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Minor and patch updates in a single PR, major ones separately
      nuget-minor-patch:
        update-types: ["minor", "patch"]
      # Avalonia packages must stay on the same version
      avalonia:
        patterns: ["Avalonia*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
