# Builds the installable packages. On a version tag (v1.2.3, v1.2.3-beta.1) it also publishes
# them as a GitHub Release; on pull requests that touch the packaging it only builds them, as a check.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['packaging/**', 'assets/icon/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from the tag, or from Directory.Build.props
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  macos:
    name: macos-package
    needs: version
    runs-on: macos-26
    # Notarization waits for Apple: the first one took about half an hour
    timeout-minutes: 90
    env:
      # Optional: without these secrets the app is signed ad-hoc and not notarized
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # An exact SDK, not "the latest 10.0" from global.json: on 2026-10-25 that pointed to a
          # 10.0.403 whose files were not published yet, and every build failed. Raise it on purpose.
          dotnet-version: 10.0.402

      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build the app and the command line tool
        run: packaging/macos/build.sh "${{ needs.version.outputs.version }}" artifacts

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos
          path: artifacts/*
          retention-days: 14

  windows:
    name: windows-package
    needs: version
    runs-on: windows-2025
    # Signing waits for the manual approval of each request in SignPath
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # An exact SDK, not "the latest 10.0" from global.json: on 2026-10-25 that pointed to a
          # 10.0.403 whose files were not published yet, and every build failed. Raise it on purpose.
          dotnet-version: 10.0.402

      # Signing with SignPath (see packaging/windows/signpath): only when the repository is configured for
      # it, and never on pull requests. Tags use the release certificate, manual runs the test one.
      - name: Signing configuration
        id: signing
        shell: bash
        env:
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          if [ -n "$ORGANIZATION" ] && [ "$HAS_TOKEN" = true ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then policy=release-signing; else policy=test-signing; fi
            echo "policy=$policy" >> "$GITHUB_OUTPUT"
            echo "Signing with SignPath, policy $policy"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Not signing (SignPath not configured, or a pull request)"
          fi

      - name: Build the program files
        shell: pwsh
        run: packaging/windows/build.ps1 -Version "${{ needs.version.outputs.version }}" -Output artifacts -Stage Files

      - name: Upload the program files to sign
        id: upload-files
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-files-windows
          path: artifacts/files/
          retention-days: 1

      - name: Sign the program files
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: program-files
          github-artifact-id: ${{ steps.upload-files.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/files

      - name: Build the installer and the portable zip
        shell: pwsh
        run: packaging/windows/build.ps1 -Version "${{ needs.version.outputs.version }}" -Output artifacts -Stage Package

      - name: Upload the installer to sign
        id: upload-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/GBFileCopier-${{ needs.version.outputs.version }}-windows-x64-setup.exe
          archive: false
          retention-days: 1

      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts

      - name: Check the signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/*-setup.exe | Select-Object -First 1
          Expand-Archive (Get-ChildItem artifacts/*-windows-x64.zip | Select-Object -First 1) -DestinationPath "$env:RUNNER_TEMP/zip"
          foreach ($file in $setup.FullName, "$env:RUNNER_TEMP/zip/GBFileCopier.exe", "$env:RUNNER_TEMP/zip/gbcopy.exe") {
            $signature = Get-AuthenticodeSignature $file
            Write-Host "$(Split-Path $file -Leaf): $($signature.Status) $($signature.SignerCertificate.Subject)"
            # The test certificate is not trusted: for it, just check that a signature is there
            if (-not $signature.SignerCertificate) { throw "$file is not signed" }
            if ('${{ steps.signing.outputs.policy }}' -eq 'release-signing' -and $signature.Status -ne 'Valid') { throw "${file}: $($signature.Status)" }
          }

      - name: Smoke test the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/*-setup.exe | Select-Object -First 1
          $app = "$env:RUNNER_TEMP\gbfc"
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=$app" -Wait
          & "$app\gbcopy.exe" info
          if (-not (Test-Path "$app\GBFileCopier.exe")) { throw 'GBFileCopier.exe not installed' }

          # Context menu entries for the current user, with the command Explorer will run
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\Directory\Background\shell\GBFileCopierPaste\command').'(default)'
          Write-Host "Paste command: $command"
          if ($command -notlike "*GBFileCopier.exe*--paste*") { throw 'Context menu entry missing' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\SendTo\GBFileCopier.lnk")) { throw 'Send to shortcut missing' }

          # A second start hands its arguments to the running app and exits, as with a multiple selection in Explorer
          $log = "$env:RUNNER_TEMP\gbfc.log"
          $first = Start-Process "$app\GBFileCopier.exe" -Environment @{ GBFILECOPIER_LOG = $log } -PassThru
          Start-Sleep -Seconds 5
          $second = Start-Process "$app\GBFileCopier.exe" -ArgumentList '--add', "`"$env:WINDIR\win.ini`"" -PassThru -Wait
          Start-Sleep -Seconds 2
          $first | Stop-Process -Force
          Get-Content $log -ErrorAction SilentlyContinue
          if ($first.HasExited -and $first.ExitCode -ne -1) { Write-Host "First instance exit code: $($first.ExitCode)" }
          if ($second.ExitCode -ne 0) { throw "Second start failed: $($second.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'Applied: sources=1' -Quiet)) { throw 'The running app did not receive the forwarded item' }

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: artifacts/*
          retention-days: 14

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          # The SignPath Foundation terms ask for the code signing policy to be linked from the release pages
          notes="Download the package for your system below. How the files are built and signed: [Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/main/CODE_SIGNING_POLICY.md)."
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" \
            --title "GBFileCopier $VERSION" --notes "$notes" --generate-notes $prerelease
